[package]
name = "team_placement_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19.1"

# Optional but recommended by the Bevy project: this makes debug builds
# noticeably faster to iterate on, since your own code stays unoptimized
# (fast to compile) while dependencies (including Bevy itself) are built
# with optimizations (fast to run).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3